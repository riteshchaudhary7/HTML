<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Input Types in Forms</h1>
    <form>
        <label for="name">Your Name:</label>
        <input type="text" name="name" id="name" placeholder="Full name" required>

        <br>
        <label for="PW">password:</label>
        <input type="password" name="password" id="PW" placeholder="Password" required>

        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>

        <br>
        <label for="number">Number:</label>
        <input type="number" name="number" id="number" placeholder="1234..." required>

        <br>
        <label for="date">Date of Birth:</label>
        <input type="date" name="date" id="date" required>

        <br>
        <label for="color">Pick Your favorite color:</label>
        <input type="color" name="color" id="color" value="#ff1234">

        <br>
        <label for="resume">Upload Your resume:</label>
        <input type="file" name="resume" id="resume">

        <br>
        <label><input type="radio" name="gender" value="Male">Male</label>
        <label><input type="radio" name="gender" value="Female">Female</label>
        <label><input type="radio" name="gender" value="Other">Other</label>

        <br>
        <p>Select Hobbies</p>
        <label><input type="checkbox" name="hobby" value="Reading">Reading</label>
        <label><input type="checkbox" name="hobby" value="Gaming">Gaming</label>
        <label><input type="checkbox" name="hobby" value="Gym">Gym</label>
        <label><input type="checkbox" name="hobby" value="coding">Coding</label>

        <br>
        <button type="submit">Sign Up</button>

        <br>
        <button type="reset">Click here to reset</button>

        <br>
        <button type="button">Click Me</button>

    </form>

    <br>
    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="Name">Name:</label>
            <input type="text" name="Name" id="Name" required>

            <br>
            <label for="Email">Email:</label>
            <input type="Email" name="Email" id="Email" placeholder="example@gmail.com" required>

            <br>
            <label for="Password">Password:</label>
            <input type="password" name="password" id="Password" placeholder="password" required>
        </fieldset>
        <br>
        <fieldset>
            <legend>Account Details</legend>

            <labels for="Password">Password:</label>
            <input type="Password" name="Password" id="Password" placeholder="Password">

            <br><br>
            <label for="color">Color:</label>
            <input type="color" name="color" id="color">

            <br><br>
            <label for="volume">Volume:</label>
            <input type="range" name="volume" id="volume" min="0" max="100" value="50">
        </fieldset>
    </form>

    <br>
    <button type="submit">Submit</button>

    <button type="reset">Reset</button>

    <button type="button">Click Me</button>
    
</body>
</html>

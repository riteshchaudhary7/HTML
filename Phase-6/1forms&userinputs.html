<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>HTML Forms</h1>
    <form>
        <label for="username">First name</label>
        <input name="username" id="username" type="text">
        <br>
        <label for="last name">last name</label>
        <input name="last name" id="last name" type="text">
        <br>
        <label for="email">Email</label>
        <input name="email" id="email" type="text">
    </form>
    <!-- 
    1- Always put inside a form.
    2- Label
    3-  connect label and input for="" and id=""
    4- right input type
    Form:
    A form in HTML is used to collect information from users 
    and send it to a server for processing.

    User Input:
    User input refers to the data entered by users through form elements 
    such as text boxes, radio buttons, checkboxes, drop-down lists, and buttons.
    -->
    
</body>
</html>

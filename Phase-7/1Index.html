<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <!-- This one is for the small data table. -->
    <table border="1">
        <caption>Fruit Price List:</caption>

        <tr>

            <th>Fruits</th>
            <th>price</th>
            <th>color</th>

        </tr>

        <tr>
            <td>Apple</td>
            <td>200</td>
            <td>Red</td>
        </tr>

        <tr>
            <td>Banana</td>
            <td>150</td>
            <td>Orange</td>
        </tr>
    </table>
</body>
</html>

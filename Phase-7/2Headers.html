<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Header</title>
</head>
<body>
    <!-- Here we use Captions,thead,tbody & tfoot..
    Remember In table, their must be one thead,one tfoot but multiple tbody.
    -->
    <table border="1">

        <caption>Fruits Price List:</caption>
        <thead>
            <tr>
                <th>Fruits</th>
                <th>Price</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>Apple</td>
                <td>200</td>
            </tr>

            <tr>
                <td>Banana</td>
                <td>150</td>
            </tr>

            <tr>
                <td>Orange</td>
                <td>180</td>
            </tr>
        </tbody>

        <tfoot>

            <tr>
                <td>Quantity: 3</td>
                <td>530</td>
            </tr>

        </tfoot>

    </table>
    
</body>
</html>

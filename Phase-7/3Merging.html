<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merging Cells</title>
</head>
<body>
    <!-- colspan=column, row span=row -->
    <h2>Column Span</h2>
    <table border="1">
        <tr>
            <th colspan="1">Fruit Store</th>
        </tr>

        <tr>
            <td>Apple</td>
            <td>120</td>
        </tr>

        <tr>
            <td>Banana</td>
            <td>100</td>
        </tr>

        <tr>
            <td>mango</td>
            <td>150</td>
        </tr>
        
        <tr>
            <td>orange</td>
            <td>50</td>
        </tr>

    </table>

    <h2>Row Span</h2>
    <table border="1">
        <tr>
            <th rowspan="3">Fruit</th>
            <td>Apple</td>
        </tr>

        <tr>
            <td>Banana</td>
        </tr>
        <tr>
            <td>Orange</td>
        </tr>

    </table>
    
</body>
</html>

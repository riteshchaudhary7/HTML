<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio/Video Example</title>
</head>
<body>
    <!-- Here is the audio link and download link. -->
    <h1>Audio Player</h1>
    <audio controls>
        <source src="Sunflower.mp3.m4a" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>
    <hr>
    <h2>Video player</h2>
    <video width="400" controls>
        <source src="Illahi.mp4.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
</body>
</html>
